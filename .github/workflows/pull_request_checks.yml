name: Tests

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Sandbox.Test
            build_project_args: --project engine\Sandbox.Test\Sandbox.Test.csproj --project engine\Tools\ShaderCompiler\ShaderCompiler.csproj
            test_project_args: --project engine\Sandbox.Test\Sandbox.Test.csproj
          - name: Fast Managed Tests
            build_project_args: --project engine\Sandbox.Test.Unit\Sandbox.Test.Unit.csproj --project engine\Sandbox.Test.Parallel\Sandbox.Test.Parallel.csproj
            test_project_args: --project engine\Sandbox.Test.Unit\Sandbox.Test.Unit.csproj --project engine\Sandbox.Test.Parallel\Sandbox.Test.Parallel.csproj
          - name: Compiler Tests
            build_project_args: --project engine\Sandbox.Compiling.Test\Sandbox.Compiling.Test.csproj --project engine\Sandbox.CodeUpgrader.Test\Sandbox.CodeUpgrader.Test.csproj
            test_project_args: --project engine\Sandbox.Compiling.Test\Sandbox.Compiling.Test.csproj --project engine\Sandbox.CodeUpgrader.Test\Sandbox.CodeUpgrader.Test.csproj
    runs-on: [ windows-latest ]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Full Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.sln', '**/*.slnx', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet10-nuget-

      - name: Build
        run: dotnet run --project .\engine\Tools\SboxBuild\SboxBuild.csproj -- build --config Developer ${{ matrix.build_project_args }}

      - name: Test
        run: dotnet run --project .\engine\Tools\SboxBuild\SboxBuild.csproj -- test --no-build ${{ matrix.test_project_args }}

      - name: Upload managed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: managed-test-results-${{ matrix.name }}
          path: engine/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7
