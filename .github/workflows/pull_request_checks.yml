name: Tests

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: [ windows-latest ]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Full Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.sln', '**/*.slnx', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet10-nuget-

      - name: Build
        run: dotnet run --project .\engine\Tools\SboxBuild\SboxBuild.csproj -- build --config Developer

      - name: Test
        run: dotnet run --project .\engine\Tools\SboxBuild\SboxBuild.csproj -- test --no-build
