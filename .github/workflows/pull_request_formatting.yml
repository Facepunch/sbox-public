name: Formatting

# Every base branch: master, and the Steam branches mirrored beside it
on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Format
        run: dotnet run --project .\engine\Tools\SboxBuild\SboxBuild.csproj -- format --verify
